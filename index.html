<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- ============================================================
       PAGINA DE ENTRADA DO GITHUB PAGES
       Esta pagina existe apenas para receber o visitante e
       redireciona automaticamente para a demonstracao real,
       que fica no arquivo sidebar.html dentro da pasta
       Hackathon_TJCE_GAMA/Assistent.
       Os estilos estao em um arquivo separado: index.css
       ============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Redirecionamento automatico do navegador para a demo -->
  <meta http-equiv="refresh" content="0; url=demonstracao.html" />

  <!-- Link canonico: ajuda buscadores a entender o destino real -->
  <link rel="canonical" href="demonstracao.html" />

  <!-- Folha de estilo externa (nada de CSS embutido aqui) -->
  <link rel="stylesheet" href="index.css" />

  <!-- Favicon: usa o logo do projeto (evita o 404 do favicon padrao) -->
  <link rel="icon" type="image/png" href="logo.png" />

  <!-- Descricao e preview de link (usado quando o jurado cola o
       endereco no chat, WhatsApp ou slide) -->
  <meta name="description" content="GAMA Assistente - assistente de suporte a tomada de decisao judicial do TJCE: triagem guiada, semaforo de risco em tres eixos e relatorio de analise anonimizado." />
  <meta property="og:title" content="GAMA Assistente - Demonstracao" />
  <meta property="og:description" content="Triagem guiada, matriz de risco em tres eixos e relatorio de analise anonimizado. Hackathon TJCE + UFC." />
  <meta property="og:image" content="https://insli.github.io/GAMA_Assistente/logo.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>GAMA Assistente - Demonstracao</title>
</head>
<body>
  <!-- Titulo exibido durante o breve instante do carregamento -->
  <h1>GAMA Assistente</h1>

  <!-- Explicacao breve do projeto para quem chega pelo link -->
  <p>
    Guia de Analise do Meio Ambiente - assistente de suporte a tomada de
    decisao judicial do TJCE. Carregando a demonstracao...
  </p>

  <!-- Botao de reserva: caso o JavaScript esteja bloqueado,
       o visitante ainda consegue chegar na demo clicando aqui -->
  <a href="demonstracao.html">Abrir demonstracao</a>

  <!--
    Redirecionamento por JavaScript. E mais rapido e confiavel
    do que apenas a meta tag de refresh acima. As duas vias
    existem para garantir que o visitante sempre chegue na demo.
  -->
  <script>
    window.location.replace("demonstracao.html");
  </script>
</body>
</html>
